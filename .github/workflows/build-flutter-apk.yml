name: Build Shohnaat Mobile Android APK & Play Store Bundle

on:
  push:
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: 📱 Build Play Store Bundle (.aab) & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 📦 Flutter Doctor & Environment Verify
        run: |
          flutter doctor -v

      - name: ⚙️ Setup Android Wrapper & Dependencies
        working-directory: ./mobile-flutter
        run: |
          flutter create . --platforms=android --org com.shohnaat
          flutter pub get

      - name: 🔨 Build Universal Release APK (.apk)
        working-directory: ./mobile-flutter
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: 🚀 Build Google Play Store App Bundle (.aab)
        working-directory: ./mobile-flutter
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: 🔨 Build Split ABI APKs (ARM64 & ARM32)
        working-directory: ./mobile-flutter
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: 📤 Upload Google Play App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shohnaat-GooglePlay-AppBundle-AAB
          path: mobile-flutter/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 📤 Upload Release APKs (.apk) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shohnaat-Logistics-Android-APK
          path: mobile-flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
