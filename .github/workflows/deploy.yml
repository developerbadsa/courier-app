name: Deploy Shohnaat to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "📥 [1/4] Pulling latest code..."
            if [ -d "$HOME/shohnaat-logistics" ]; then
              cd "$HOME/shohnaat-logistics"
            else
              git clone https://github.com/developerbadsa/courier-app.git "$HOME/shohnaat-logistics"
              cd "$HOME/shohnaat-logistics"
            fi
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 [2/4] Building Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "🗄️ [3/4] Database sync..."
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma generate || true
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma db push --accept-data-loss || true
            docker compose -f docker-compose.prod.yml exec -T backend node prisma/seed.js || true

            echo "✅ [4/4] Deployment complete!"
            docker ps --filter "name=shohnaat"
            curl -s http://localhost:5001/health || echo "Backend starting..."
