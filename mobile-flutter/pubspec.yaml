name: shohnaat_mobile
description: "Shohnaat Logistics - Cross-Platform Mobile Application for Riders, Merchants, and Customers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage & Offline Cache
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Typography & Icons
  lucide_icons_flutter: ^3.1.15

  # Hardware & Native Features
  url_launcher: ^6.3.0
  signature: ^5.5.0
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  mobile_scanner: ^7.4.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#0F172A"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
