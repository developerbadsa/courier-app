# Shohnaat Logistics — Nginx Reverse Proxy
# Install: sudo cp nginx-shohnaat.conf /etc/nginx/conf.d/shohnaat.conf
# Test:    sudo nginx -t && sudo systemctl reload nginx

# ── Upstream ─────────────────────────────────────────────────
upstream shohnaat_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream shohnaat_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shohnaat.rahimbadsa.me api.shohnaat.rahimbadsa.me;

    # For Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend (HTTPS) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shohnaat.rahimbadsa.me;

    # SSL (after running certbot)
    ssl_certificate /etc/letsencrypt/live/shohnaat.rahimbadsa.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shohnaat.rahimbadsa.me/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Static files
    location /_next/static/ {
        proxy_pass http://shohnaat_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://shohnaat_frontend;
        proxy_cache_valid 200 365d;
    }

    # All other routes → Next.js
    location / {
        proxy_pass http://shohnaat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── API (HTTPS) ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shohnaat.rahimbadsa.me;

    # SSL
    ssl_certificate /etc/letsencrypt/live/shohnaat.rahimbadsa.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shohnaat.rahimbadsa.me/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Request-ID $request_id always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # API proxy
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://shohnaat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
