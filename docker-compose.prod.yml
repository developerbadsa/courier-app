# ============================================================
# Shohnaat Logistics — Production Docker Compose
# ============================================================
# Deploy: bash deploy.sh
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: shohnaat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shohnaat_prod
      POSTGRES_USER: shohnaat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shohnaat_prod_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No port exposed externally — internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shohnaat -d shohnaat_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shohnaat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # No port exposed externally — internal network only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./shohnaat-backend
      dockerfile: Dockerfile.prod
    container_name: shohnaat-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"   # Only localhost — nginx proxies
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://shohnaat:${DB_PASSWORD:-shohnaat_prod_2026}@db:5432/shohnaat_prod
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-jwt-shohnaat-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-refresh-shohnaat-2026}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shohnaat-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"   # Only localhost — nginx proxies
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    driver: local
