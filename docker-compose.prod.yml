# ============================================================
# Shohnaat Logistics — Production Docker Compose
# ============================================================
# Deploy: bash deploy.sh
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: shohnaat-db
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_buffers=128MB -c work_mem=8MB
    environment:
      POSTGRES_DB: shohnaat_prod
      POSTGRES_USER: shohnaat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shohnaat_prod_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shohnaat -d shohnaat_prod"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shohnaat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # No port exposed externally — internal network only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./shohnaat-backend
      dockerfile: Dockerfile.prod
    container_name: shohnaat-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://shohnaat:${DB_PASSWORD:-shohnaat_prod_2026}@db:5432/shohnaat_prod?connection_limit=20&pool_timeout=20&connect_timeout=15
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-jwt-shohnaat-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-refresh-shohnaat-2026}
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shohnaat-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api-shohnaat.rahimbadsa.me
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Storage & Media Microservice ────────────────────────────
  storage:
    build:
      context: ./shohnaat-storage-service
      dockerfile: Dockerfile
    container_name: shohnaat-storage
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      STORAGE_PATH: /app/uploads
      STORAGE_SERVICE_SECRET: ${STORAGE_SERVICE_SECRET:-shohnaat_storage_internal_secret_2026}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
